<script>
    // Supabase Configuration (Aapki nayi aur sahi details ke sath)
    const SUPABASE_URL = 'https://goqmkifenqeussjcgdub.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvcW1raWZlbnFldXNzamNnZHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTIyNDMsImV4cCI6MjEwMDcyODI0M30.7lp9uJuJTfO5Wf0V59kGv4GGqdyk0FBtelOUu6UD7ic'; 
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUpMode = false;

    // ----- AUTHENTICATION LOGIC -----

    // Check if user is already logged in
    async function checkSession() {
        try {
            const { data: { session }, error } = await supabase.auth.getSession();
            if (error) throw error;
            
            if (session) {
                showDashboard(session.user.email);
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        } catch (err) {
            console.error("Session check error:", err);
            document.getElementById('auth-section').style.display = 'block';
        }
    }

    // Toggle between Login and Sign Up
    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-error').innerText = '';
        if (isSignUpMode) {
            document.getElementById('auth-title').innerText = "Create Account";
            document.getElementById('auth-submit-btn').innerText = "Sign Up";
            document.getElementById('auth-toggle-text').innerText = "Already have an account? Sign In";
        } else {
            document.getElementById('auth-title').innerText = "Sign In";
            document.getElementById('auth-submit-btn').innerText = "Login";
            document.getElementById('auth-toggle-text').innerText = "Don't have an account? Sign Up";
        }
    }

    // Handle Login or Sign Up (With Mobile Alerts)
    async function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const password = document.getElementById('auth-password').value;
        const errorDiv = document.getElementById('auth-error');
        const btn = document.getElementById('auth-submit-btn');
        
        // Validation check
        if(!email || !password) {
            alert("⚠️ Error: Email aur Password dono daalna zaroori hai!");
            return;
        }
        if(password.length < 6) {
            alert("⚠️ Error: Password kam se kam 6 characters ka hona chahiye!");
            return;
        }

        btn.innerText = "Please wait...";
        errorDiv.innerText = "";

        try {
            if (isSignUpMode) {
                // Sign Up User
                const { data, error } = await supabase.auth.signUp({ email: email, password: password });
                
                if (error) {
                    alert("❌ Sign Up Fail: " + error.message);
                    errorDiv.innerText = error.message;
                } else {
                    alert("✅ ID Ban Gayi Hai! Ab aap Login kar sakte hain.");
                    toggleAuthMode(); // Wapas login page par bhej do
                    document.getElementById('auth-password').value = ''; // Password field clear kar do
                }
            } else {
                // Log In User
                const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: password });
                
                if (error) {
                    alert("❌ Login Fail: " + error.message);
                    errorDiv.innerText = error.message;
                } else {
                    alert("✅ Login Success!");
                    showDashboard(data.user.email);
                }
            }
        } catch (err) {
            alert("⚠️ System Error: " + err.message);
        } finally {
            // Button ka text wapas normal kar do
            btn.innerText = isSignUpMode ? "Sign Up" : "Login";
        }
    }

    // Logout
    async function logoutUser() {
        await supabase.auth.signOut();
        document.getElementById('auth-email').value = '';
        document.getElementById('auth-password').value = '';
        document.getElementById('auth-submit-btn').innerText = "Login";
        document.getElementById('auth-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
        alert("Aap successfully logout ho gaye hain.");
    }

    // Show Dashboard after successful login
    function showDashboard(userEmail) {
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
        document.getElementById('user-email-display').innerText = userEmail;
        loadCourses(); // Database se courses load karein
    }


    // ----- DASHBOARD & COURSE LOGIC -----

    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.target.classList.add('active');
    }

    async function loadCourses() {
        const courseList = document.getElementById('course-list');
        
        const { data: courses, error } = await supabase
            .from('courses')
            .select('*')
            .eq('status', 'Approved')
            .order('created_at', { ascending: false });

        if (error) {
            courseList.innerHTML = '<p style="color:red;">Error loading courses: ' + error.message + '</p>';
            return;
        }

        if(!courses || courses.length === 0) {
            courseList.innerHTML = '<p>No courses available right now.</p>';
            return;
        }

        courseList.innerHTML = ''; 

        courses.forEach(course => {
            let videoId = "";
            if(course.video_url.includes('v=')) {
                videoId = course.video_url.split('v=')[1].split('&')[0];
            } else if(course.video_url.includes('youtu.be/')) {
                videoId = course.video_url.split('youtu.be/')[1].split('?')[0];
            }

            let actionBtn = course.type === 'Free' 
                ? `<button class="btn">Watch Free</button>`
                : `<button class="btn btn-pay" onclick="payUPI('${course.title}', ${course.price})">Pay ₹${course.price} via UPI/QR</button>`;

            courseList.innerHTML += `
                <div class="course-card">
                    <h4>${course.title} <span style="color: ${course.type === 'Free' ? '#28a745' : '#007bff'}">(${course.type})</span></h4>
                    ${videoId ? `<iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>` : `<p style="color:red;">Invalid Video URL</p>`}
                    ${actionBtn}
                </div>
            `;
        });
    }

    function payUPI(title, price) {
        alert(`Scan QR to pay ₹${price} for "${title}".\n(Payment gateway integration goes here)`);
    }

    // Initialize checking session on page load
    window.onload = checkSession;
</script>
