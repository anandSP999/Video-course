<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Studio</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; padding: 0; background: #f8f9fa; }
        .container { max-width: 600px; margin: auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px;}
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; }
        .btn { width: 100%; padding: 14px; background: #6f42c1; color: white; border: none; border-radius: 6px; font-weight: bold; margin-top: 10px; cursor: pointer;}
        .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; overflow-x: auto; background:#fff; border-radius:8px;}
        .tab { padding: 15px; flex: 1; text-align: center; font-weight: bold; cursor: pointer; min-width: 120px; border-bottom: 3px solid transparent;}
        .tab.active { color: #6f42c1; border-bottom: 3px solid #6f42c1; }
        .content { display: none; }
        .content.active { display: block; }
    </style>
</head>
<body>

<div id="auth-section" class="container" style="margin-top:50px;">
    <div class="card">
        <h2 style="text-align:center; color:#6f42c1;">Academy Login</h2>
        <input type="email" id="email" placeholder="Email" style="margin-bottom:10px;">
        <input type="password" id="password" placeholder="Password (Min 6 chars)">
        <button class="btn" onclick="login()">Login / Create Account</button>
    </div>
</div>

<div id="app-section" class="container" style="display:none;">
    <h2 style="color:#6f42c1;">Academy Studio</h2>
    
    <div class="tabs">
        <div class="tab active" onclick="switchTab('create-course')">1. Create Course</div>
        <div class="tab" onclick="switchTab('add-chapter')">2. Add Chapters</div>
    </div>

    <!-- Create Main Course -->
    <div id="create-course" class="content active card">
        <h3>Create Main Course / Playlist</h3>
        <input type="text" id="cTitle" placeholder="Course Title (e.g., Freelancing 101)" class="form-group">
        <input type="url" id="cThumb" placeholder="Thumbnail Image URL" class="form-group">
        <select id="cType" class="form-group" onchange="document.getElementById('cPrice').style.display = this.value==='Paid' ? 'block' : 'none'">
            <option value="Free">Free Course</option>
            <option value="Paid">Paid Course</option>
        </select>
        <input type="number" id="cPrice" placeholder="Price (₹)" class="form-group" style="display:none;">
        <button class="btn" onclick="createCourse()">Create Main Course</button>
    </div>

    <!-- Add Chapters to Course -->
    <div id="add-chapter" class="content card">
        <h3>Add Video Chapters</h3>
        <select id="select-course" class="form-group"><option>Loading your courses...</option></select>
        <input type="text" id="chTitle" placeholder="Chapter Title (e.g., Ep 1: Introduction)" class="form-group">
        <input type="url" id="chVideo" placeholder="YouTube Video URL" class="form-group">
        <textarea id="chNotes" placeholder="Notes or Drive Link (Optional)" class="form-group"></textarea>
        <button class="btn" style="background:#28a745;" onclick="addChapter()">+ Add Chapter</button>
    </div>
</div>

<script>
    const supabase = window.supabase.createClient('https://goqmkifenqeussjcgdub.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdvcW1raWZlbnFldXNzamNnZHViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNTIyNDMsImV4cCI6MjEwMDcyODI0M30.7lp9uJuJTfO5Wf0V59kGv4GGqdyk0FBtelOUu6UD7ic');
    let userEmail = "";

    async function login() {
        const e = document.getElementById('email').value, p = document.getElementById('password').value;
        let { data, error } = await supabase.auth.signInWithPassword({ email: e, password: p });
        if(error) { 
            let res = await supabase.auth.signUp({ email: e, password: p });
            if(!res.error) data = res.data; else return alert(res.error.message);
        }
        userEmail = data.user.email;
        document.getElementById('auth-section').style.display = 'none';
        document.getElementById('app-section').style.display = 'block';
        loadMyCourses();
    }

    function switchTab(id) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
        if(id === 'add-chapter') loadMyCourses();
    }

    async function createCourse() {
        const data = {
            academy_email: userEmail,
            title: document.getElementById('cTitle').value,
            thumbnail_url: document.getElementById('cThumb').value,
            type: document.getElementById('cType').value,
            price: document.getElementById('cPrice').value || 0,
            status: 'Pending'
        };
        const { error } = await supabase.from('courses').insert([data]);
        if(error) alert(error.message); else { alert('Course Created! Now add chapters.'); document.getElementById('cTitle').value=''; }
    }

    async function loadMyCourses() {
        const select = document.getElementById('select-course');
        const { data } = await supabase.from('courses').select('id, title').eq('academy_email', userEmail);
        select.innerHTML = data ? data.map(c => `<option value="${c.id}">${c.title}</option>`).join('') : '<option>No courses found</option>';
    }

    async function addChapter() {
        const data = {
            course_id: document.getElementById('select-course').value,
            chapter_title: document.getElementById('chTitle').value,
            video_url: document.getElementById('chVideo').value,
            notes: document.getElementById('chNotes').value
        };
        const { error } = await supabase.from('chapters').insert([data]);
        if(error) alert(error.message); else { alert('Chapter Added!'); document.getElementById('chTitle').value=''; document.getElementById('chVideo').value=''; }
    }
</script>
</body>
</html>
