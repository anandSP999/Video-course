<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Portal</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; background: #fff8e1; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #ff8f00; margin-top: 0;}
        h3 { color: #333; margin-bottom: 5px; }
        input, textarea, select { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ced4da; border-radius: 6px; box-sizing: border-box; font-size: 15px;}
        label { font-weight: bold; color: #555; }
        .btn { padding: 15px; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold;}
        .btn-profile { background: #17a2b8; }
        .btn-course { background: #ffc107; color: #000; }
        hr { margin: 30px 0; border: 1px solid #f0f0f0; }
    </style>
</head>
<body>

<div class="container">
    <h2>Academy Partner Portal</h2>

    <h3>1. Setup Academy Profile</h3>
    <form id="profileForm" onsubmit="saveProfile(event)">
        <label>Academy Name</label>
        <input type="text" id="aName" placeholder="e.g. Tech Vision Academy" required>
        
        <label>Head Teacher Name</label>
        <input type="text" id="aTeacher" required>
        
        <label>Contact Mobile Number</label>
        <input type="tel" id="aMobile" required>
        
        <label>Payment / UPI Details</label>
        <textarea id="aPayment" rows="2" placeholder="UPI ID or Bank Ac No" required></textarea>
        
        <button type="submit" class="btn btn-profile" id="profBtn">Save Profile Settings</button>
    </form>

    <hr>

    <h3>2. Upload Course (Pending Approval)</h3>
    <form id="courseForm" onsubmit="submitCourse(event)">
        <label>Course Title</label>
        <input type="text" id="acTitle" required>

        <label>YouTube Video URL</label>
        <input type="url" id="acVideo" required>

        <label>Course Type</label>
        <select id="acType" onchange="toggleAcPrice()">
            <option value="Free">Free</option>
            <option value="Paid">Paid</option>
        </select>

        <div id="acPriceDiv" style="display:none;">
            <label>Price (₹)</label>
            <input type="number" id="acPrice" value="0">
        </div>

        <button type="submit" class="btn btn-course" id="crsBtn">Submit to Admin for Review</button>
    </form>
</div>

<script>
    // Apni Supabase API yahan daalein
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function toggleAcPrice() {
        const type = document.getElementById('acType').value;
        document.getElementById('acPriceDiv').style.display = type === 'Paid' ? 'block' : 'none';
        if(type === 'Free') document.getElementById('acPrice').value = 0;
    }

    async function saveProfile(e) {
        e.preventDefault();
        const btn = document.getElementById('profBtn');
        btn.innerText = "Saving...";

        const profileData = {
            academy_name: document.getElementById('aName').value,
            teacher_name: document.getElementById('aTeacher').value,
            mobile: document.getElementById('aMobile').value,
            payment_details: document.getElementById('aPayment').value
        };

        const { error } = await supabase.from('academy_profiles').insert([profileData]);
        
        if(error) alert("Error saving profile: " + error.message);
        else alert("Profile details securely saved!");
        
        btn.innerText = "Save Profile Settings";
    }

    async function submitCourse(e) {
        e.preventDefault();
        const btn = document.getElementById('crsBtn');
        btn.innerText = "Submitting...";

        const courseData = {
            title: document.getElementById('acTitle').value,
            video_url: document.getElementById('acVideo').value,
            type: document.getElementById('acType').value,
            price: document.getElementById('acPrice').value,
            status: 'Pending' // Admin Supabase dashboard se isko 'Approved' karega
        };

        const { error } = await supabase.from('courses').insert([courseData]);
        
        if(error) alert("Error: " + error.message);
        else {
            alert("Course successfully sent to Admin for approval!");
            document.getElementById('courseForm').reset();
            toggleAcPrice();
        }
        
        btn.innerText = "Submit to Admin for Review";
    }
</script>
</body>
</html>
